[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "awp-langgraph"
version = "0.1.0a1"
description = "One-line LangGraph integration for the Agent Work Protocol (AWP) — signed attestations per node execution."
readme = "README.md"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Inertia Labs", email = "hello@inertialabs.xyz" },
]
keywords = ["awp", "langgraph", "agents", "attestation", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

# Runtime deps are intentionally minimal: the telemetry module uses only the
# standard library (urllib) so the SDK can be installed in environments that
# disallow extra HTTP clients. The full SDK (Step 3) will add awp-core-py
# and langgraph as required dependencies.

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/inertialabsxyz/awp"
Repository = "https://github.com/inertialabsxyz/awp"
Documentation = "https://docs.awp-cloud.xyz"

[tool.hatch.build.targets.wheel]
packages = ["awp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
