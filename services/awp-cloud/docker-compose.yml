# Local development stack for `awp-cloud`.
#
# Brings up:
#  - Postgres 16 with a persisted volume
#  - The `awp-cloud` API server, built from the local Dockerfile
#  - Minio (S3-compatible) — defined for parity with the staging deploy. The
#    in-cluster `awp-cloud` defaults to a filesystem blob store mounted to a
#    docker volume; flip `BLOB_BACKEND=s3` (plus the matching env vars) when
#    the S3 blob impl lands.
#
# Usage:
#   docker compose up -d
#   docker compose exec awp-cloud /usr/local/bin/awp-cloud-seed   # 10k attestations
#
# Stop and wipe state:
#   docker compose down -v

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: awp
      POSTGRES_PASSWORD: awp
      POSTGRES_DB: awp_cloud
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awp -d awp_cloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  awp-cloud:
    build:
      context: ../..
      dockerfile: services/awp-cloud/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://awp:awp@postgres:5432/awp_cloud
      BLOB_ROOT: /var/lib/awp-cloud/blobs
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info,awp_cloud=debug
    ports:
      - "8080:8080"
    volumes:
      - blob-data:/var/lib/awp-cloud/blobs

volumes:
  pg-data:
  minio-data:
  blob-data:
