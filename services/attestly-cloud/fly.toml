app = "attestly-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDR    = "0.0.0.0:8080"
  BLOB_ROOT    = "/var/lib/attestly-cloud/blobs"
  RUST_LOG     = "info,attestly_cloud=info"
  ATTESTLY_CLOUD_BASE_URL = "https://app.attestly.xyz"

# DATABASE_URL is supplied as a Fly secret pointing at the managed Neon /
# Supabase instance — `flyctl secrets set DATABASE_URL=...`.

[mounts]
  source      = "attestly_cloud_blobs"
  destination = "/var/lib/attestly-cloud/blobs"

[http_service]
  internal_port    = 8080
  force_https      = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.healthz]
      type     = "http"
      method   = "GET"
      path     = "/healthz"
      interval = "10s"
      timeout  = "2s"
      grace_period = "10s"

[[vm]]
  cpu_kind    = "shared"
  cpus        = 1
  memory_mb   = 512
