[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "awp-core-py"
version = "0.1.0"
description = "Python bindings for the Agent Work Protocol (AWP) — sign and verify cryptographic attestations of agent work."
readme = "README.md"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Inertia Labs", email = "hello@inertialabs.xyz" },
]
keywords = ["awp", "agents", "attestation", "ed25519", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/inertialabsxyz/awp"
Repository = "https://github.com/inertialabsxyz/awp"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.maturin]
module-name = "awp._native"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
# Collect both the standard `test_*.py` files and the spec-named
# `cross_language.py` self-test.
testpaths = ["tests"]
python_files = ["test_*.py", "cross_language.py"]
